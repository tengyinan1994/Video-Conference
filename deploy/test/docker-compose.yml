# Video Conference — dept 全量部署（独立 MySQL/Redis，数据 bind mount 到 DATA_DIR）
# 用法见 deploy/test/README.md 或 ./deploy/test/deploy.sh full

name: video-conference

networks:
  vc_net:
    name: video_conference_net

services:
  mysql:
    image: mysql:8.0
    container_name: vc-mysql
    restart: unless-stopped
    networks:
      - vc_net
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_conference}
      MYSQL_USER: ${MYSQL_USER:-video_conference}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hg123456.}
    volumes:
      - ${DATA_DIR}/mysql:/var/lib/mysql
      - ./init/01-hotgo.sql:/docker-entrypoint-initdb.d/01-hotgo.sql:ro
      - ./init/02-conference-addon.sql:/docker-entrypoint-initdb.d/02-conference-addon.sql:ro
      - ./init/03-conference-meeting.sql:/docker-entrypoint-initdb.d/03-conference-meeting.sql:ro
      - ./init/04-conference-menu.sql:/docker-entrypoint-initdb.d/04-conference-menu.sql:ro
      - ./init/05-conference-meeting-attendees.sql:/docker-entrypoint-initdb.d/05-conference-meeting-attendees.sql:ro
      - ./init/06-conference-recording.sql:/docker-entrypoint-initdb.d/06-conference-recording.sql:ro
      - ./init/07-conference-meeting-actual-start.sql:/docker-entrypoint-initdb.d/07-conference-meeting-actual-start.sql:ro
      - ./init/08-conference-meeting-type.sql:/docker-entrypoint-initdb.d/08-conference-meeting-type.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: vc-redis
    restart: unless-stopped
    networks:
      - vc_net
    volumes:
      - ${DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    container_name: vc-rustfs
    restart: unless-stopped
    networks:
      - vc_net
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    volumes:
      - ${DATA_DIR}/rustfs:/data
    ports:
      - "${RUSTFS_PORT:-17886}:9000"
      - "${RUSTFS_CONSOLE_PORT:-17887}:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  rustfs-init:
    image: minio/mc:latest
    container_name: vc-rustfs-init
    networks:
      - vc_net
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-recordings}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"
        mc mb -p "local/$$RUSTFS_BUCKET" || true
        echo "bucket $$RUSTFS_BUCKET ready"
    restart: "no"

  livekit:
    image: ${LIVEKIT_IMAGE:-video-conference/livekit:amd64}
    container_name: vc-livekit
    restart: unless-stopped
    networks:
      - vc_net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: ${LIVEKIT_RTC_TCP_PORT:-17881}
          udp_port: ${LIVEKIT_RTC_UDP_PORT:-17882}
          use_external_ip: false
        redis:
          address: redis:6379
          db: 0
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecret12}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-devkey}
          urls:
            - http://hotgo:8000/api/conference/webhook/livekit
        logging:
          level: info
    command:
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "${LIVEKIT_SIGNAL_PORT:-17880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-17881}:${LIVEKIT_RTC_TCP_PORT:-17881}"
      - "${LIVEKIT_RTC_UDP_PORT:-17882}:${LIVEKIT_RTC_UDP_PORT:-17882}/udp"

  egress:
    image: livekit/egress:latest
    container_name: vc-egress
    restart: unless-stopped
    networks:
      - vc_net
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecret12}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          db: 0
        insecure: true
        logging:
          level: info
        s3:
          access_key: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
          secret: ${RUSTFS_SECRET_KEY:-rustfsadmin}
          region: us-east-1
          endpoint: http://rustfs:9000
          bucket: ${RUSTFS_BUCKET:-recordings}
          force_path_style: true
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

  hotgo:
    image: video-conference/hotgo:${ARCH:-amd64}
    container_name: vc-hotgo
    restart: unless-stopped
    networks:
      - vc_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      rustfs:
        condition: service_healthy
    volumes:
      - ./config:/app/manifest/config:ro
      - ${DATA_DIR}/hotgo/logs:/app/logs
      - ${DATA_DIR}/hotgo/storage:/app/storage

  minutes-worker:
    image: ${MINUTES_WORKER_IMAGE:-video-conference/minutes-worker:amd64}
    container_name: vc-minutes-worker
    restart: unless-stopped
    environment:
      PORT: "8090"
      ASR_BACKEND: ${ASR_BACKEND:-funasr}
      MOCK_LLM: ${MOCK_LLM:-0}
      FUNASR_MODEL: ${FUNASR_MODEL:-paraformer-zh}
      FUNASR_VAD_MODEL: ${FUNASR_VAD_MODEL:-fsmn-vad}
      FUNASR_PUNC_MODEL: ${FUNASR_PUNC_MODEL:-ct-punc}
      MODELSCOPE_CACHE: /data/models
      HOME: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      HOTGO_CALLBACK_URL: http://hotgo:8000/api/conference/minutes/callback
      MINUTES_WORKER_SECRET: ${MINUTES_WORKER_SECRET:-dev-minutes-secret}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: recordings
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - ${DATA_DIR}/minutes-worker:/data
    networks:
      - vc_net
    depends_on:
      rustfs:
        condition: service_healthy
      hotgo:
        condition: service_started

  # 管理后台独立 HTTPS 网关（反代 HotGo）
  admin:
    image: video-conference/admin:${ARCH:-amd64}
    container_name: vc-admin
    restart: unless-stopped
    networks:
      - vc_net
    depends_on:
      - hotgo
    ports:
      - "${ADMIN_PORT:-17883}:443"
      - "${ADMIN_HTTP_PORT:-17884}:80"

  client:
    image: video-conference/client:${ARCH:-amd64}
    container_name: vc-client
    restart: unless-stopped
    networks:
      - vc_net
    depends_on:
      - hotgo
      - livekit
    ports:
      - "${CLIENT_PORT:-17885}:443"
      - "${CLIENT_HTTP_PORT:-17888}:80"
