# LiveKit Egress 配置（compose 挂载；密钥与 Redis 地址由环境变量覆盖更方便时再用 EGRESS_CONFIG_BODY）
api_key: devkey
api_secret: secretsecretsecretsecretsecret12
ws_url: ws://livekit:7880
redis:
  address: redis:6379
  db: 0
insecure: true
logging:
  level: info
s3:
  access_key: rustfsadmin
  secret: rustfsadmin
  region: us-east-1
  endpoint: http://rustfs:9000
  bucket: recordings
  force_path_style: true
