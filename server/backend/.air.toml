# HotGo HTTP 热更新（在本目录执行：air）
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  entrypoint = ["./tmp/main", "http"]
  delay = 1000
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  exclude_dir = ["tmp", "vendor", "logs", "storage", "resource/public", "resource/template", "manifest/output", "bin", "docs"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false
  send_interrupt = true
  kill_delay = "2s"
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
